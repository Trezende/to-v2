<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel de Iniciativas Estratégicas — Protótipo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --purple-900:#3c1361;
    --purple-800:#4c1d95;
    --purple-700:#5b21b6;
    --purple-600:#6d28d9;
    --purple-500:#7c3aed;
    --purple-100:#ede9fe;
    --purple-50:#f5f3ff;
    --sidebar-bg:#3d3548;
    --sidebar-bg-2:#453c52;
    --sidebar-text:#c9c2d6;
    --bg:#f2f3f7;
    --card-bg:#ffffff;
    --border:#e3e1ea;
    --text-dark:#26232e;
    --text-mid:#5b5768;
    --text-light:#8b8798;
    --green-bg:#dcf3de;
    --green-text:#276e35;
    --shadow: 0 1px 3px rgba(30,20,50,0.08), 0 1px 2px rgba(30,20,50,0.06);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    background:var(--bg);
    color:var(--text-dark);
    font-size:14px;
  }
  .app{
    display:flex;
    flex-direction:column;
    height:100vh;
  }

  /* ===== Header bar ===== */
  .topbar{
    background:linear-gradient(90deg,var(--purple-800),var(--purple-700));
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:10px 20px;
    flex-shrink:0;
  }
  .topbar-left{
    display:flex;
    align-items:center;
    gap:10px;
    font-weight:600;
    font-size:15px;
  }
  .topbar-left .folder-icon{
    width:20px;height:20px;
    opacity:.9;
  }
  .back-btn{
    background:rgba(255,255,255,.12);
    border:1px solid rgba(255,255,255,.3);
    color:#fff;
    padding:6px 12px;
    border-radius:6px;
    font-size:13px;
    font-weight:500;
    cursor:pointer;
    display:flex;
    align-items:center;
    gap:6px;
  }
  .back-btn:hover{background:rgba(255,255,255,.22);}
  .topbar-right{
    display:flex;
    align-items:center;
    gap:14px;
  }
  .icon-btn{
    width:30px;height:30px;
    border-radius:6px;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    background:rgba(255,255,255,.08);
    border:none;
    color:#fff;
  }
  .icon-btn:hover{background:rgba(255,255,255,.2);}

  /* ===== Tab strip ===== */
  .tabstrip-row{
    background:#fff;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:12px 20px;
    border-bottom:1px solid var(--border);
    flex-shrink:0;
    gap:16px;
  }
  .status-chip{
    background:var(--green-bg);
    color:var(--green-text);
    border-radius:6px;
    padding:6px 16px;
    text-align:center;
    font-size:11px;
    font-weight:700;
    letter-spacing:.02em;
    min-width:150px;
  }
  .status-chip .sub{
    display:block;
    font-weight:500;
    font-size:12px;
    margin-top:2px;
  }
  .tabs{
    display:flex;
    gap:6px;
    flex:1;
    justify-content:center;
    flex-wrap:wrap;
  }
  .tab-btn{
    border:none;
    background:#eceaf2;
    color:#8b859a;
    padding:10px 22px;
    border-radius:6px;
    font-weight:700;
    font-size:13px;
    letter-spacing:.03em;
    cursor:pointer;
    transition:all .15s ease;
  }
  .tab-btn:hover{background:#e1ddec;}
  .tab-btn.active{
    background:var(--purple-600);
    color:#fff;
  }
  .advance-btn{
    background:var(--purple-600);
    color:#fff;
    border:none;
    padding:10px 18px;
    border-radius:6px;
    font-weight:700;
    font-size:13px;
    cursor:pointer;
    display:flex;
    align-items:center;
    gap:8px;
    white-space:nowrap;
  }
  .advance-btn:hover{background:var(--purple-700);}

  /* ===== Body layout ===== */
  .body-row{
    flex:1;
    display:flex;
    overflow:hidden;
  }

  /* ===== Sidebar ===== */
  .sidebar{
    width:230px;
    background:var(--sidebar-bg);
    color:var(--sidebar-text);
    display:flex;
    flex-direction:column;
    flex-shrink:0;
    overflow-y:auto;
    padding:14px 0;
  }
  .side-fixed{
    padding:0 10px;
    margin-bottom:10px;
  }
  .side-item{
    display:flex;
    align-items:center;
    gap:10px;
    padding:9px 12px;
    border-radius:6px;
    cursor:pointer;
    font-size:13px;
    font-weight:500;
    color:var(--sidebar-text);
  }
  .side-item:hover{background:rgba(255,255,255,.06);}
  .side-item svg{flex-shrink:0;opacity:.8;}
  .side-item.active{background:var(--purple-500);color:#fff;font-weight:600;}
  .side-item.active svg{opacity:1;}
  .side-divider{
    height:1px;
    background:rgba(255,255,255,.08);
    margin:8px 14px;
  }
  .side-group{padding:0 10px;}
  .side-group-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:9px 12px;
    font-weight:700;
    font-size:12px;
    letter-spacing:.04em;
    color:#a89fbb;
    cursor:pointer;
    border-radius:6px;
  }
  .side-group-header:hover{background:rgba(255,255,255,.06);}
  .side-group.active-group .side-group-header{color:#fff;}
  .side-group-header .chev{
    transition:transform .15s ease;
    opacity:.7;
  }
  .side-group.collapsed .side-group-header .chev{transform:rotate(-90deg);}
  .side-subitems{
    overflow:hidden;
    max-height:400px;
    transition:max-height .2s ease;
  }
  .side-group.collapsed .side-subitems{max-height:0;}
  .side-subitem{
    padding:8px 12px 8px 24px;
    font-size:13px;
    border-radius:6px;
    cursor:pointer;
    color:var(--sidebar-text);
    margin:1px 0;
  }
  .side-subitem:hover{background:rgba(255,255,255,.06);}
  .side-subitem.active{
    background:var(--purple-500);
    color:#fff;
    font-weight:600;
  }
  .sidebar-bottom{
    margin-top:auto;
    padding:10px;
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .side-action-btn{
    background:var(--purple-600);
    color:#fff;
    border:none;
    padding:10px 12px;
    border-radius:6px;
    font-weight:700;
    font-size:12.5px;
    display:flex;
    align-items:center;
    gap:8px;
    cursor:pointer;
  }
  .side-action-btn:hover{background:var(--purple-700);}

  /* ===== Main content ===== */
  .main{
    flex:1;
    display:flex;
    flex-direction:column;
    overflow-y:auto;
  }
  .content-scroll{
    flex:1;
    padding:20px 24px 90px 24px;
  }
  .context-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:18px;
    flex-wrap:wrap;
    gap:10px;
  }
  .breadcrumb{
    font-size:13px;
    font-weight:700;
    color:var(--purple-600);
    letter-spacing:.02em;
  }
  .stage-title{
    font-size:14px;
    font-weight:700;
    color:var(--purple-700);
    letter-spacing:.03em;
  }
  .grid2{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:18px;
  }
  @media (max-width:900px){
    .grid2{grid-template-columns:1fr;}
  }
  .card{
    background:var(--card-bg);
    border-radius:10px;
    box-shadow:var(--shadow);
    padding:18px 20px;
    margin-bottom:18px;
  }
  .card.span2{grid-column:1/-1;}
  .section-band{
    background:var(--purple-100);
    color:var(--purple-800);
    font-weight:700;
    font-size:12.5px;
    letter-spacing:.03em;
    padding:8px 12px;
    border-radius:6px;
    margin-bottom:14px;
  }
  .field-label{
    display:flex;
    align-items:center;
    gap:6px;
    font-weight:600;
    font-size:13px;
    margin-bottom:8px;
    color:var(--text-dark);
  }
  .help-q{
    width:15px;height:15px;
    border-radius:50%;
    border:1.4px solid var(--purple-400,#a78bfa);
    color:var(--purple-600);
    font-size:10px;
    font-weight:700;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    cursor:help;
    flex-shrink:0;
  }
  input[type=text],input[type=number],select,textarea{
    width:100%;
    font-family:inherit;
    font-size:13.5px;
    padding:9px 11px;
    border:1px solid var(--border);
    border-radius:6px;
    background:#fafafc;
    color:var(--text-dark);
  }
  textarea{resize:vertical;min-height:80px;}
  input[type=text]:focus,textarea:focus,select:focus{
    outline:none;
    border-color:var(--purple-500);
    background:#fff;
  }
  .field-block{margin-bottom:16px;}
  .field-block:last-child{margin-bottom:0;}

  /* rich text editor look */
  .rte{
    border:1px solid var(--border);
    border-radius:6px;
    overflow:hidden;
  }
  .rte-toolbar{
    display:flex;
    align-items:center;
    gap:4px;
    background:#fafafc;
    border-bottom:1px solid var(--border);
    padding:6px 8px;
    flex-wrap:wrap;
  }
  .rte-toolbar select{
    width:auto;
    padding:5px 8px;
    font-size:12px;
  }
  .rte-btn{
    width:26px;height:26px;
    border:none;
    background:transparent;
    border-radius:4px;
    color:var(--text-mid);
    font-size:13px;
    font-weight:700;
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;
  }
  .rte-btn:hover{background:#e9e6f2;}
  .rte-sep{width:1px;height:18px;background:var(--border);margin:0 3px;}
  .rte-body{
    padding:12px 14px;
    min-height:120px;
    max-height:220px;
    overflow-y:auto;
    font-size:13.5px;
    line-height:1.6;
    color:var(--text-mid);
  }
  .rte-body[contenteditable]:focus{outline:none;background:#fdfcff;}
  .rte-body ol,.rte-body ul{margin:6px 0;padding-left:20px;}
  .rte-body:empty:before{content:attr(data-placeholder);color:var(--text-light);}
  textarea::placeholder{color:var(--text-light);}
  input[type=text]::placeholder{color:var(--text-light);}

  /* checklist */
  .checklist{list-style:none;padding:0;margin:0;counter-reset:step;}
  .checklist>li{
    counter-increment:step;
    margin-bottom:10px;
    font-size:13.5px;
  }
  .checklist>li::before{
    content:counter(step)". ";
    font-weight:700;
    color:var(--purple-700);
  }
  .checklist .sub{
    list-style:disc;
    margin:6px 0 0 20px;
    padding:0;
    color:var(--text-mid);
    font-size:13px;
  }
  .checklist .sub li{margin-bottom:4px;}

  /* radios / checkboxes */
  .opt-row{
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:10px;
    font-size:13.5px;
    cursor:pointer;
  }
  .opt-row input{margin:0;accent-color:var(--purple-600);width:15px;height:15px;flex-shrink:0;}
  .opt-row.inline{display:inline-flex;margin-right:24px;}
  .opt-hint{
    display:block;
    font-size:12px;
    color:var(--text-light);
    font-style:italic;
    margin:2px 0 8px 23px;
  }
  .opt-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:4px 24px;
  }
  .pills{display:flex;gap:8px;align-items:center;}
  .pill-add{
    width:28px;height:28px;
    background:var(--purple-600);
    color:#fff;
    border:none;
    border-radius:6px;
    font-size:16px;
    cursor:pointer;
  }
  .pill{
    padding:9px 18px;
    border-radius:6px;
    background:#f1eefa;
    color:var(--purple-700);
    font-weight:700;
    font-size:14px;
    border:1px solid transparent;
    cursor:pointer;
  }
  .pill.active{border-color:var(--purple-500);background:#fff;}

  .table-simple{width:100%;border-collapse:collapse;font-size:13px;}
  .table-simple th{
    text-align:left;
    color:var(--purple-700);
    font-weight:700;
    font-size:11.5px;
    letter-spacing:.03em;
    padding:8px 6px;
    border-bottom:2px solid var(--purple-100);
  }
  .table-simple td{
    padding:10px 6px;
    border-bottom:1px solid var(--border);
  }
  .table-simple tr:last-child td{border-bottom:none;}
  .badge-x{
    color:#b0abbe;
    cursor:pointer;
    font-weight:700;
  }

  .strategy-banner{
    border-radius:8px;
    overflow:hidden;
    margin-bottom:16px;
  }
  .strategy-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:14px 18px;
    color:#fff;
    font-weight:700;
    font-size:13px;
    letter-spacing:.02em;
  }
  .strategy-row.r1{background:var(--purple-800);}
  .strategy-row.r2{background:var(--purple-600);}
  .strategy-row.r3{background:#9a7fd6;}
  .avatar-dot{
    width:26px;height:26px;
    border-radius:50%;
    background:rgba(255,255,255,.25);
    display:flex;align-items:center;justify-content:center;
    font-size:11px;
    border:1px solid rgba(255,255,255,.5);
  }
  .select-obj-btn{
    background:var(--purple-900);
    color:#fff;
    border:none;
    border-radius:6px;
    padding:6px 12px;
    font-size:11.5px;
    font-weight:700;
    cursor:pointer;
  }

  .toggle-row{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:10px;
    font-size:13.5px;
    font-weight:600;
  }
  .toggle{
    width:38px;height:20px;
    border-radius:12px;
    background:#dcdae3;
    position:relative;
    cursor:pointer;
    flex-shrink:0;
    transition:background .15s;
  }
  .toggle.on{background:var(--purple-600);}
  .toggle::after{
    content:'';
    position:absolute;
    top:2px;left:2px;
    width:16px;height:16px;
    background:#fff;
    border-radius:50%;
    transition:left .15s;
    box-shadow:0 1px 2px rgba(0,0,0,.3);
  }
  .toggle.on::after{left:20px;}

  .date-field{position:relative;}
  .date-field input{padding-right:36px;}
  .cal-icon{
    position:absolute;right:8px;top:50%;transform:translateY(-50%);
    width:22px;height:22px;background:var(--purple-500);border-radius:4px;
    display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;
  }

  .kv-callout{
    background:var(--purple-600);
    color:#fff;
    border-radius:8px;
    padding:12px 14px;
    font-size:12.5px;
    font-weight:600;
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:10px;
    cursor:pointer;
    line-height:1.4;
  }
  .kv-callout .ic{
    width:28px;height:28px;
    background:rgba(255,255,255,.2);
    border-radius:6px;
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;
  }

  .thermo-row{
    display:flex;
    justify-content:space-between;
    gap:6px;
    margin-top:8px;
  }
  .thermo-face{
    flex:1;
    text-align:center;
    padding:10px 4px;
    border-radius:8px;
    background:#f5f4f9;
    cursor:pointer;
    font-size:22px;
    border:2px solid transparent;
  }
  .thermo-face.sel{border-color:var(--purple-500);background:var(--purple-50);}
  .thermo-label{font-size:10px;color:var(--text-light);display:block;margin-top:4px;}

  .kpi-table th,.kpi-table td{text-align:center;}
  .kpi-table th:first-child,.kpi-table td:first-child{text-align:left;}

  .metrics-filter-row{
    display:flex;
    flex-wrap:wrap;
    gap:22px;
  }
  .filter-item{min-width:170px;flex:1;}
  .filter-item .field-label{margin-bottom:8px;}
  .filter-control{display:flex;align-items:center;gap:8px;}
  .filter-control select{flex:1;}
  .freq-value{
    font-weight:700;
    color:var(--purple-700);
    letter-spacing:.02em;
    padding:9px 0;
    font-size:13.5px;
  }
  .metrics-table{min-width:900px;}
  .metrics-table th{white-space:nowrap;}
  .metrics-table td{padding:8px 6px;}
  .metrics-table input[type=text]{
    min-width:80px;
    padding:8px 9px;
    text-align:center;
  }
  .flag-cell{text-align:center;}
  .flag-btn{
    width:26px;height:26px;
    border-radius:6px;
    background:var(--purple-500);
    border:none;
    color:#fff;
    cursor:pointer;
    display:inline-flex;
    align-items:center;
    justify-content:center;
  }
  .flag-btn:hover{background:var(--purple-700);}
  .metrics-table td.badge-x{text-align:center;}

  .report-layout{
    display:flex;
    align-items:stretch;
    gap:0;
  }
  .report-nav{
    display:flex;
    flex-direction:column;
    width:310px;
    flex-shrink:0;
    border-right:4px solid var(--purple-600);
  }
  .report-nav-item{
    background:#93899f;
    color:#fff;
    padding:20px 22px;
    text-align:right;
    font-weight:700;
    font-size:12.5px;
    letter-spacing:.03em;
    cursor:pointer;
    border-bottom:1px solid rgba(255,255,255,.15);
  }
  .report-nav-item:hover{background:#7f7690;}
  .report-nav-item.active{background:var(--purple-600);}
  .report-content{
    flex:1;
    padding:0 0 0 28px;
    min-width:0;
  }
  .report-content .field-label{font-size:14px;margin-bottom:12px;}
  .report-content textarea{min-height:420px;}
  .report-band-group{margin-bottom:22px;}
  .report-band-group:last-child{margin-bottom:0;}
  .report-band-group textarea{min-height:110px;}

  /* footer save bar */
  .save-bar{
    position:sticky;
    bottom:0;
    display:flex;
    justify-content:flex-end;
    padding:14px 0 4px 0;
  }
  .save-btn{
    background:var(--purple-600);
    color:#fff;
    border:none;
    padding:11px 26px;
    border-radius:6px;
    font-weight:700;
    font-size:13.5px;
    cursor:pointer;
    box-shadow:0 4px 10px rgba(109,40,217,.3);
    display:flex;align-items:center;gap:8px;
  }
  .save-btn:hover{background:var(--purple-700);}

  /* status footer */
  .statusfooter{
    flex-shrink:0;
    background:#f7f6fa;
    border-top:1px solid var(--border);
    padding:8px 20px;
    display:flex;
    gap:24px;
    font-size:11.5px;
    color:var(--text-light);
    align-items:center;
  }
  .statusfooter .badge{
    background:#e6e2f2;
    color:var(--purple-700);
    padding:2px 8px;
    border-radius:4px;
    font-weight:700;
  }
  .statusfooter .spacer{flex:1;}

  .toast{
    position:fixed;
    bottom:24px;
    right:24px;
    background:var(--text-dark);
    color:#fff;
    padding:12px 18px;
    border-radius:8px;
    font-size:13px;
    font-weight:600;
    box-shadow:0 6px 20px rgba(0,0,0,.25);
    opacity:0;
    transform:translateY(10px);
    transition:all .25s ease;
    pointer-events:none;
    z-index:50;
  }
  .toast.show{opacity:1;transform:translateY(0);}
</style>
</head>
<body>

<div class="app">

  <!-- Top bar -->
  <div class="topbar">
    <div class="topbar-left">
      <svg class="folder-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z"/></svg>
      <span id="initiativeTitle">[Piloto de Capacitação] Programa Trilhas de Aprendizagem</span>
    </div>
    <div class="topbar-right">
      <button class="back-btn" onclick="showToast('Voltando para a lista de iniciativas (protótipo)')">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 18l-6-6 6-6"/></svg>
        Voltar
      </button>
      <button class="icon-btn" title="Histórico" onclick="showToast('Histórico de alterações (protótipo)')">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/><path d="M12 7v5l3 3"/></svg>
      </button>
      <button class="icon-btn" title="Comentários" onclick="showToast('Comentários (protótipo)')">

}

    const isMetrics = item.view === 'metricas_sucesso';

      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">${ICONS[item.icon]}</svg>
      ${item.label}
    </div>`;
  });
  html += `</div><div class="side-divider"></div>`;

  STAGES.forEach(s=>{
    const isActiveGroup = s.id === state.stage;
    html += `<div class="side-group ${isActiveGroup?'active-group':'collapsed'}" data-stage="${s.id}">
      <div class="side-group-header" onclick="toggleGroup('${s.id}')">
        <span>${s.label}</span>
        <svg class="chev" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M6 9l6 6 6-6"/></svg>
      </div>
      <div class="side-subitems">
        ${SECTIONS[s.id].map(sec=>`
          <div class="side-subitem ${(!state.fixedView && isActiveGroup && sec.id===state.section)?'active':''}" onclick="selectSection('${s.id}','${sec.id}')">${sec.label}</div>
        `).join('')}
      </div>
    </div>`;
  });

  html += `<div class="sidebar-bottom">
    <button class="side-action-btn" onclick="showToast('Evidências anexadas (protótipo)')">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">${ICONS.paperclip}</svg>

      Configurações
    </button>
  </div>`;

  el.innerHTML = html;
}

function toggleGroup(stageId){
  const group = document.querySelector(`.side-group[data-stage="${stageId}"]`);
  if(stageId === state.stage){
    // active group toggles collapse visually but keeps state
    group.classList.toggle('collapsed');
    return;
  }
  group.classList.toggle('collapsed');
}

function reportSubpage(tab){
  switch(tab){
    case 'percepcao_resultados':
      return `
        <div class="field-label">Os stakeholders da iniciativa enxergam valor nos resultados gerados? Quais feedbacks recebidos?</div>
        <textarea></textarea>
      `;
    case 'percepcao_mudancas':
      return `
        <div class="field-label">Como os stakeholders da iniciativa enxergam a execução das mudanças?</div>
        <textarea></textarea>
      `;
    case 'sustentabilidade':
      return `
        <div class="field-label">Os resultados são sustentáveis a longo prazo? Quais fatores de sucesso para garantir a sustentabilidade?</div>
        <textarea></textarea>
      `;
    case 'licoes':
      return `
        <div class="report-band-group">
          <div class="section-band">LIÇÕES APRENDIDAS DURANTE O ESTÁGIO DE PILOTO</div>
          <textarea placeholder="Não se aplica"></textarea>
        </div>
        <div class="report-band-group">
          <div class="section-band">LIÇÕES APRENDIDAS DURANTE O ESTÁGIO DE ESCALA</div>
          <textarea placeholder="Não se aplica"></textarea>
        </div>
        <div class="report-band-group">
          <div class="section-band">LIÇÕES APRENDIDAS APÓS CONCLUÍDO O ESTÁGIO DE ESCALA</div>
          <textarea></textarea>
        </div>
      `;
    case 'continuidade':
      return `
        <div class="field-label">Descreva os principais fatores para o sucesso e continuidade dos benefícios da iniciativa. ${help()}</div>
        <textarea></textarea>
      `;
    default:
      return '';
  }
}

function selectThermo(el){
  el.parentElement.querySelectorAll('.thermo-face').forEach(f=>f.classList.remove('sel'));
  el.classList.add('sel');
}

function renderContent(){
  const key = state.fixedView ? state.fixedView : `${state.stage}_${state.section}`;
  const el = document.getElementById('content');
  el.innerHTML = CONTENT[key] ? CONTENT[key]() : `<div class="card">Conteúdo não disponível.</div>`;
}

function renderAll(){
  renderTabs();
  renderSidebar();
  renderContent();
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(()=>t.classList.remove('show'), 2200);
}

renderAll();
</script>
